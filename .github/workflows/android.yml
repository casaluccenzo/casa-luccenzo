name: Android APK

# El APK es un "cascarón" (Trusted Web Activity) que abre el POS de Vercel en
# Chrome a pantalla completa. Las pantallas se actualizan solas con cada deploy
# de la web; este workflow solo hace falta cuando cambia algo de android/.
#
# - Pull requests: compila un APK de prueba (firma debug) para validar el build.
# - Push a main / ejecución manual: compila el APK firmado y lo publica en el
#   release fijo "android-latest" (pre-release, así la app de escritorio sigue
#   viendo su propio release como el "latest"). Link de descarga estable:
#   https://github.com/casaluccenzo/casa-luccenzo/releases/download/android-latest/casa-lucenzo.apk
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar llave de firma
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Sin llave de firma: se compila un APK debug solo para validar el build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Faltan los secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD. Sin la llave de siempre, el APK no se puede instalar encima del anterior."
            exit 1
          fi

      - name: Compilar APK firmado
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/casa-lucenzo.apk"

      - name: Compilar APK de prueba (debug)
        if: steps.signing.outputs.signed != 'true'
        run: |
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/casa-lucenzo.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: casa-lucenzo-apk
          path: ${{ runner.temp }}/casa-lucenzo.apk

      - name: Publicar en el release android-latest
        if: github.event_name != 'pull_request' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest "$RUNNER_TEMP/casa-lucenzo.apk" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "App Android (APK ${VERSION}, build ${{ github.run_number }})" \
            --notes "Descargar casa-lucenzo.apk en la tablet e instalar. Las pantallas se actualizan solas con cada deploy de la web; este APK solo cambia si cambia el cascarón Android."
