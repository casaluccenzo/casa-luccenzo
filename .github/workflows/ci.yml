name: CI

# `main` is the default branch and the one Vercel deploys. This used to say
# `master`, a branch abandoned back at v256 -- so CI had not run on anything
# that reached production since, including the four "La guaira" hotfixes
# (v280-v283) that went out during a live data-integrity incident.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify local build (no prod env vars)
        run: npm run build

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
